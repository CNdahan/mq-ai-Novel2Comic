# =====================================================
# Redis 自定义配置
# =====================================================

# 绑定地址（Docker 内部使用）
bind 0.0.0.0

# 保护模式（关闭，因为在内网）
protected-mode no

# 端口
port 6379

# 持久化配置
save 900 1
save 300 10
save 60 10000

# AOF 持久化
appendonly yes
appendfsync everysec

# 最大内存
maxmemory 256mb
maxmemory-policy allkeys-lru

# 日志
loglevel notice

# 数据库数量
databases 16

