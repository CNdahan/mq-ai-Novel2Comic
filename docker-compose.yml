# =====================================================
# Novel2Comic Docker Compose 配置文件
# =====================================================
# 版本：v1.0.0
# 功能：一键启动所有服务（MySQL、Redis、后端、前端）
# 使用：docker-compose up -d
# =====================================================

version: '3.8'

services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: novel2comic-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Novel2Comic@2025}
      MYSQL_DATABASE: mq_novel2comic
      MYSQL_USER: novel2comic
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Novel2Comic@2025}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init_database_prod.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/mysql.cnf:/etc/mysql/conf.d/custom.cnf:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Novel2Comic@2025}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - novel2comic-network

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: novel2comic-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - novel2comic-network

  # ==================== 后端服务 ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: novel2comic-backend
    restart: always
    environment:
      # Spring 配置
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      
      # 数据库配置
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mq_novel2comic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: novel2comic
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-Novel2Comic@2025}
      
      # Redis 配置
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      
      # JWT 密钥（生产环境请修改！）
      JWT_SECRET: ${JWT_SECRET:-PLEASE-CHANGE-THIS-TO-A-COMPLEX-RANDOM-SECRET-KEY-AT-LEAST-64-CHARACTERS-LONG-FOR-PRODUCTION}
      
      # LLM 配置（文本生成）
      LLM_PROVIDER: ${LLM_PROVIDER:-zhipu}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-your-zhipu-api-key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-your-deepseek-api-key}
      ALIYUN_API_KEY: ${ALIYUN_API_KEY:-your-aliyun-api-key}
      
      # AIGC 配置（图片生成）
      AIGC_PROVIDER: ${AIGC_PROVIDER:-siliconflow}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-your-siliconflow-api-key}
      
      # JVM 参数
      JAVA_OPTS: -Xms512m -Xmx2g -XX:+UseG1GC
    ports:
      - "${BACKEND_PORT:-8123}:8123"
    volumes:
      - backend_images:/app/images
      - backend_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - novel2comic-network

  # ==================== 前端服务 ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: novel2comic-frontend
    restart: always
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - novel2comic-network

# ==================== 数据卷 ====================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_images:
    driver: local
  backend_logs:
    driver: local

# ==================== 网络 ====================
networks:
  novel2comic-network:
    driver: bridge

